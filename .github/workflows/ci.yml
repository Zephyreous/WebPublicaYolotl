name: CI

on:
  push:
  pull_request:

# Permisos mínimos: el workflow solo necesita leer el repositorio.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Acciones fijadas por SHA (no por etiqueta) para que no cambien sin revisión.
      # Dependabot propone las actualizaciones (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
      - name: Formato
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Tipos (astro check)
        run: npm run check
      - name: Contraste de color y reglas de marca
        run: npm test
      - name: Build
        run: npm run build
      - name: CSP de vercel.json cubre el build
        run: npm run verify:csp
