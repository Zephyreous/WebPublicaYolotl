<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Fondo Cuadrado Azul Noche -->
  <rect width="512" height="512" rx="96" fill="#0D1F38" />
  
  <!-- Colibrí escalado y centrado ópticamente -->
  <g transform="translate(18, 12) scale(2.35)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pecho y cola inferior -->
    <path d="M 155 62 C 138 66, 134 95, 125 112 C 115 130, 98 134, 82 134 L 68 164 C 82 158, 92 146, 95 134" fill="#E96E24" stroke="#E96E24" stroke-width="4" />
    <!-- Pico -->
    <path d="M 142 62 L 192 58 L 144 70 Z" fill="#E96E24" />
    <!-- Ala secundaria izquierda -->
    <path d="M 96 74 L 38 74 C 46 94, 66 106, 90 108" stroke="#F5F3EE" stroke-width="6" fill="none" />
    <!-- Ala superior -->
    <path d="M 65 74 L 60 40 L 106 78" stroke="#19A796" stroke-width="6" fill="none" />
    <!-- Cabeza y arco dorsal -->
    <path d="M 104 75 C 110 52, 132 48, 145 62" stroke="#19A796" stroke-width="6" fill="none" />
    <!-- Cuerpo hacia la cola -->
    <path d="M 118 92 C 118 118, 98 134, 82 134 L 52 164 L 90 108" stroke="#19A796" stroke-width="6" fill="none" />
    <!-- Núcleo central -->
    <circle cx="98" cy="92" r="18" fill="#0D1F38" stroke="#19A796" stroke-width="6" />
    <!-- Ojo -->
    <circle cx="128" cy="63" r="4" fill="#F5F3EE" />
  </g>
</svg>